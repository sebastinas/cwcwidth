name: Linters

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Run "ruff format"
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
      - name: Run "ruff check"
        uses: astral-sh/ruff-action@v4.1.0

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@master
        with:
          skip: "_impl.c"
