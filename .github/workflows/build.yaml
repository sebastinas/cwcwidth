name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
        - "3.15t"
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pytest
    - name: Build with Python ${{ matrix.python-version }}
      run: |
        python -m build
    - name: Install wheel
      run: python -m pip install --no-index --find-links dist cwcwidth
    - name: Test with pytest
      working-directory: ${{ runner.temp }}
      run: python -m pytest --import-mode=importlib "${{ github.workspace }}/tests"
      env:
        LC_ALL: C.UTF-8
        LANG: C.UTF-8

  build-limited-api:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      USE_LIMITED_API: "1"
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pytest
    - name: Build with Python ${{ matrix.python-version }}
      run: |
        python -m build
    - name: Install wheel
      run: python -m pip install --no-index --find-links dist cwcwidth
    - name: Test with pytest
      working-directory: ${{ runner.temp }}
      run: python -m pytest --import-mode=importlib "${{ github.workspace }}/tests"
      env:
        LC_ALL: C.UTF-8
        LANG: C.UTF-8
